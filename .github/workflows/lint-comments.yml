name: Lint comments

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts
      - run: python scripts/lint_comments.py
