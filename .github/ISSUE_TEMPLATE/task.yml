name: Task / work request
description: Create a clear, scoped work request
title: "[Task] "
labels: ["task"]

body:
  - type: markdown
    attributes:
      value: Something broken? Use the **Bug report** form instead.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be accomplished?
      placeholder: Describe the desired outcome.
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: Affected area
      description: Page, feature, component, file, or system involved.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of work
      options:
        - Feature
        - Design / UI
        - Brand
        - Content
        - SEO
        - Performance
        - Accessibility
        - Analytics
        - Automation
        - Refactor
        - Research
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant links, screenshots, references, or background.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the task is complete?
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What should explicitly not be changed?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "High: blocks people or a deadline. Medium: needed soon. Low: nice to have."
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: How bad would it be if this change broke something?
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request should remain focused on one objective.
          required: true
