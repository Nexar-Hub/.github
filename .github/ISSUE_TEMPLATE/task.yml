name: Task / work request
description: Create a clear, scoped work request
title: "[Task] "

body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be accomplished?
      placeholder: Describe the desired outcome.
    validations:
      required: true

  - type: textarea
    id: area
    attributes:
      label: Affected area
      description: Page, feature, component, file, or system involved.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of work
      options:
        - Bug
        - Feature
        - Design / UI
        - Content
        - SEO
        - Performance
        - Accessibility
        - Refactor
        - Research
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant links, screenshots, references, or background.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the task is complete?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What should explicitly not be changed?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request should remain focused on one objective.
          required: true
